[package]
name = "lagi-core"
version = "1.8.0"
edition = "2021"
description = "Liumi Autonomous General Intelligence Core Engine - Rust implementation"
authors = ["Liumi Corporation"]
license = "Proprietary"
repository = "https://github.com/limi/lagi-core"
readme = "README.md"
keywords = ["agi", "encryption", "container", "security", "rust"]
categories = ["cryptography", "security", "data-structures"]

# The public, sanitized CLI binary distributed to end users.
# Packaging/inspection logic is internal-only (see lagi-forge below).
[[bin]]
name = "lagi"
path = "src/main.rs"

# INTERNAL - Liumi Corporation employees only. Never ship this binary.
# No-code forge wizard: compiles .gguf + manifest + .lbc codex into sealed
# AES-256-GCM .lagi containers.
[[bin]]
name = "lagi-forge"
path = "src/bin/lagi-forge.rs"

[dependencies]
# Cryptography
aes-gcm = { version = "0.10", features = ["aes", "getrandom"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
hkdf = "0.12"
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rand = { version = "0.8", features = ["getrandom"] }
subtle = "2.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"

# Binary format
byteorder = "1.5"

# Compression
zstd = "0.13"
flate2 = "1.0"
tar = "0.4"

# File/path utilities
walkdir = "2"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
rpassword = "7.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async Runtime & High-Precision Timers
tokio = { version = "1.40", features = ["full", "time"] }

# Local Vector Memory & Embeddings
rusqlite = { version = "0.31", features = ["bundled"] }

# Timestamps & IDs
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
sysinfo = "0.30"

# Real local inference (optional; requires cmake + C++ toolchain)
llama-cpp-2 = { version = "0.1", optional = true, default-features = false, features = ["sampler"] }
encoding_rs = { version = "0.8", optional = true }

# High-resolution time
instant = "0.1"

# HTTP client (zero-bloat: no native-tls, no browser binaries)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
# HTML parsing for web search snippet extraction
regex = "1.10"
# Default browser opening
open = "5.1"

# HTTP API server (OpenAI-compatible endpoints)
axum = { version = "0.7", optional = true, features = ["json"] }
tower-http = { version = "0.5", optional = true, features = ["cors"] }
futures = { version = "0.3", optional = true }

# Platform-specific dependencies
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Com"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = "4.2"

[dev-dependencies]
tempfile = "3"

[features]
default = ["cli", "serve"]
cli = []
serve = ["dep:axum", "dep:tower-http", "dep:futures"]
sqlite-vec = []
llama = ["dep:llama-cpp-2", "dep:encoding_rs"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
